name: CI/CD Pipeline - Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da API Node.js
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/startup-api:latest

      - name: Build e Push do Front-end React
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/startup-frontend:latest